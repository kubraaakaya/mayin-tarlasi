</style></head><body><main><h1>✦ Mayın Tarlası</h1><section><div class="choices"><button class="selected" data-mode="easy">Başlangıç · 9×9</button><button data-mode="medium">Orta · 16×16</button><button data-mode="expert">Uzman · 30×16</button><button data-mode="custom">Özel</button></div><div class="fields"><label>SATIR<input id="rows" type="number" min="5" max="40" value="9"></label><label>SÜTUN<input id="cols" type="number" min="5" max="50" value="9"></label><label>MAYIN<input id="mines" type="number" min="1" value="10"></label><button id="restart">↻ Yeni oyun</button></div><div id="error"></div></section><section><div class="hud"><div class="stat"><strong id="left">10</strong><small>KALAN MAYIN</small></div><div class="stat"><strong id="clock">00:00</strong><small>SÜRE</small></div><div class="stat"><strong id="progress">0%</strong><small>İLERLEME</small></div></div><div id="status">İlk hamlen güvenli!</div><div class="controls"><button id="dig" class="selected">□ Aç</button><button id="flag">⚑ Bayrak</button><button id="minus">−</button><span id="zoomLabel">100%</span><button id="plus">+</button><button id="fit">⤢ Sığdır</button></div><div id="view"><div id="board"></div></div><p>Tek parmakla kaydır · İki parmakla yakınlaştır · Uzun basarak bayrak koy · Bilgisayarda sağ tık bayrak</p><p id="record"></p></section></main><div id="confetti"></div><script>
(()=>{'use strict';const E=id=>document.getElementById(id),board=E('board'),view=E('view');let R=9,C=9,M=10,cells=[],first=true,over=false,opened=0,flags=0,sec=0,timer=null,tool='dig',s=1,tx=0,ty=0,ptr=new Map(),anchor=null,down=null,hold=null,held=false,pinching=false;const presets={easy:[9,9,10],medium:[16,16,40],expert:[16,30,99]},idx=(r,c)=>r*C+c;function neighbors(i){let r=Math.floor(i/C),c=i%C,a=[];for(let y=-1;y<=1;y++)for(let x=-1;x<=1;x++)if((x||y)&&r+y>=0&&r+y<R&&c+x>=0&&c+x<C)a.push(idx(r+y,c+x));return a}const format=t=>String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');function stats(){E('left').textContent=M-flags;E('clock').textContent=format(sec);E('progress').textContent=Math.round(opened/(R*C-M)*100)+'%'}function transform(){board.style.transform='translate('+tx+'px,'+ty+'px) scale('+s+')';E('zoomLabel').textContent=Math.round(s*100)+'%'}function fit(){let w=C*41+20,h=R*41+20;s=Math.max(.23,Math.min(1,(view.clientWidth-10)/w,(view.clientHeight-10)/h));tx=(view.clientWidth-w*s)/2;ty=(view.clientHeight-h*s)/2;transform()}function zoom(k,x=view.clientWidth/2,y=view.clientHeight/2){let n=Math.max(.23,Math.min(3.5,s*k));tx=x-(x-tx)*n/s;ty=y-(y-ty)*n/s;s=n;transform()}function choose(t){tool=t;E('dig').classList.toggle('selected',t==='dig');E('flag').classList.toggle('selected',t==='flag')}function stop(){over=true;clearInterval(timer);timer=null}function newGame(){let r=+E('rows').value,c=+E('cols').value,m=+E('mines').value;if(![r,c,m].every(Number.isInteger)||r<5||r>40||c<5||c>50||m<1||m>=r*c){E('error').textContent='Satır 5–40, sütun 5–50 ve mayın sayısı kare sayısından küçük olmalı.';return}E('error').textContent='';R=r;C=c;M=m;clearInterval(timer);timer=null;sec=0;opened=0;flags=0;first=true;over=false;cells=Array.from({length:R*C},()=>({mine:false,n:0,open:false,flag:false}));board.innerHTML='';board.style.gridTemplateColumns='repeat('+C+',39px)';let f=document.createDocumentFragment();for(let i=0;i<cells.length;i++){let b=d w Set();while(q.length){let j=q.pop(),v=cells[j];if(seen.has(j)||v.open||v.flag)continue;seen.add(j);v.open=true;opened++;paint(j);if(!v.n)for(let k of neighbors(j))if(!cells[k].mine&&!cells[k].open)q.push(k)}stats();if(opened===R*C-M)victory();else E('status').textContent='Güvenli kareleri bul!'}function autoRevealAfterCorrectFlag(){if(first||over)return;let changed=true;while(changed&&!over){changed=false;const safe=new Set();for(let j=0;j<cells.length;j++){const v=cells[j];if(!v.open||v.mine||v.n===0)continue;const a=neighbors(j),flagged=a.filter(k=>cells[k].flag);if(flagged.length!==v.n||!flagged.every(k=>cells[k].mine))continue;for(const k of a)if(!cells[k].open&&!cells[k].flag&&!cells[k].mine)safe.add(k)}if(safe.size){changed=true;for(const k of safe){if(over)break;open(k)}}}}function flag(i){if(over||cells[i].open)return;cells[i].flag=!cells[i].flag;flags+=cells[i].flag?1:-1;paint(i);stats();autoRevealAfterCorrectFlag()}function tap(i){if(tool==='flag')return flag(i);if(cells[i].open){const a=neighbors(i);if(cells[i].n&&a.filter(j=>cells[j].flag).length===cells[i].n)a.filter(j=>!cells[j].flag&&!cells[j].open).forEach(open)}else open(i)}board.addEventListener('contextmenu',e=>{e.preventDefault();const b=e.target.closest('.cell');if(b)flag(+b.dataset.i)});view.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;view.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptr.size===1){down={x:e.clientX,y:e.clientY,target:e.target.closest('.cell'),moved:false,lastX:e.clientX,lastY:e.clientY};held=false;pinching=false;clearTimeout(hold);if(e.pointerType==='touch'&&down.target)hold=setTimeout(()=>{if(down&&!down.moved){flag(+down.target.dataset.i);held=true}},550)}else{clearTimeout(hold);pinching=true;if(down)down.moved=true;let p=[...ptr.values()],r=view.getBoundingClientRect();anchor={dist:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),s,tx,ty,cx:(p[0].x+p[1].x)/2-r.left,cy:(p[0].y+p[1].y)/2-r.top}}});view.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptr.size>=2&&anchor){clearTimeout(hold);let p=[...ptr.values()],r=view.getBoundingClientRect(),d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),cx=(p[0].x+p[1].x)/2-r.left,cy=(p[0].y+p[1].y)/2-r.top,n=Math.max(.23,Math.min(3.5,anchor.s*d/Math.max(1,anchor.dist)));tx=cx-(anchor.cx-anchor.tx)*n/anchor.s;ty=cy-(anchor.cy-anchor.ty)*n/anchor.s;s=n;transform();return}if(down){let dx=e.clientX-down.x,dy=e.clientY-down.y;if(Math.hypot(dx,dy)>9){down.moved=true;clearTimeout(hold)}if(down.moved){tx+=e.clientX-down.lastX;ty+=e.clientY-down.lastY;transform()}down.lastX=e.clientX;down.lastY=e.clientY}});function release(e){if(!ptr.has(e.pointerId))return;let single=ptr.size===1;ptr.delete(e.pointerId);clearTimeout(hold);if(single&&!pinching&&down&&!down.moved&&!held&&down.target&&e.type==='pointerup')tap(+down.target.dataset.i);if(ptr.size<2)anchor=null;if(ptr.size===0){down=null;pinching=false}}view.addEventListener('pointerup',release);view.addEventListener('pointercancel',release);view.addEventListener('lostpointercapture',release);view.addEventListener('wheel',e=>{e.preventDefault();let r=view.getBoundingClientRect();zoom(e.deltaY<0?1.12:.89,e.clientX-r.left,e.clientY-r.top)},{passive:false});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(q=>q.classList.toggle('selected',q===b));if(presets[b.dataset.mode]){let a=presets[b.dataset.mode];E('rows').value=a[0];E('cols').value=a[1];E('mines').value=a[2];newGame()}});['rows','cols','mines'].forEach(id=>E(id).addEventListener('input',()=>document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('selected',b.dataset.mode==='custom'))));E('restart').onclick=newGame;E('dig').onclick=()=>choose('dig');E('flag').onclick=()=>choose('flag');E('minus').onclick=()=>zoom(1/1.2);E('plus').onclick=()=>zoom(1.2);E('fit').onclick=fit;window.addEventListener('resi
